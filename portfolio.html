<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Scenic Media Productions</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:black;
            color:white;
        }

        nav{
            width:100%;
            background:#111;
            padding:20px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        nav h2{
            font-size:30px;
        }

        nav ul{
            display:flex;
            list-style:none;
        }

        nav ul li{
            margin-left:30px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            font-size:18px;
        }

        .portfolio{
            padding:60px 8%;
        }

        .portfolio h1{
            text-align:center;
            font-size:50px;
            margin-bottom:15px;
        }

        .portfolio p{
            text-align:center;
            color:#bbb;
            margin-bottom:50px;
        }

        .gallery{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
            gap:30px;
        }

        .card{
            background:#111;
            border-radius:15px;
            overflow:hidden;
            border:1px solid #333;
        }

        .card img,
        .card video{
            width:100%;
            height:300px;
            object-fit:cover;
            display:block;
        }

    </style>

</head>

<body>

<nav>

    <h2>SCENIC MEDIA PRODUCTIONS</h2>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

</nav>

<section class="portfolio">

    <h1>OUR PORTFOLIO</h1>

    <p>
        Capturing moments with cinematic excellence.
    </p>

    <div class="gallery">

        <div class="card">
            <video controls>
                <source src="assets/videos/portfolio-videos/ad1.MP4" type="video/mp4">
            </video>
        </div>

        <div class="card">
            <img src="assets/images/portfolio-images/port1.JPG">
        </div>

        <div class="card">
            <video controls>
                <source src="assets/videos/portfolio-videos/ad2.MP4" type="video/mp4">
            </video>
        </div>

        <div class="card">
            <img src="assets/images/portfolio-images/port2.JPG">
        </div>

        <div class="card">
            <video controls>
                <source src="assets/videos/portfolio-videos/ad3.MP4" type="video/mp4">
            </video>
        </div>

        <div class="card">
            <img src="assets/images/portfolio-images/port3.JPG">
        </div>

    </div>

</section>

</body>
</html>
